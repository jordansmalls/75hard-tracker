# Optional local services. Not needed if you already run Postgres locally
# (e.g. Homebrew, Herd, Postgres.app).
#
#   docker compose up -d
#
# Mailpit catches outgoing email at http://localhost:8025. To use it, set
# MAIL_MAILER=smtp, MAIL_HOST=127.0.0.1 and MAIL_PORT=1025 in api/.env.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hard75
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
